services:
  ctfd:
    image: ctfd/ctfd:latest
    container_name: ctfd
    ports:
      - "8000:8000"
    networks:
      - ctf_public
    volumes:
      - ctfd_data:/var/lib/ctfd
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  web:
    build: ./web
    container_name: web
    ports:
      - "80:3000"
    networks:
      - ctf_public
      - ctf_internal
    depends_on:
      - db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  db:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ctf_root_pass
      MYSQL_DATABASE: ctfdb
      MYSQL_USER: ctfuser
      MYSQL_PASSWORD: ctf_pass
    networks:
      - ctf_internal
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  linuxbox:
    build: ./linuxbox
    container_name: linuxbox
    ports:
      - "22:22"
    networks:
      - ctf_public
    restart: unless-stopped
    # NOTE: no-new-privileges and cap_drop are DELIBERATELY OMITTED here.
    # Stage 6 requires the SUID binary /usr/local/bin/syscheck to run
    # with elevated privileges. Blocking new privileges would break the challenge.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  ctf_public:
    driver: bridge
  ctf_internal:
    driver: bridge

volumes:
  ctfd_data:
  db_data: